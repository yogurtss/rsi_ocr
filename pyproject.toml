[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "glyphstack"
version = "0.1.0"
description = "Region-level hard-example mining for PaddleOCR-VL"
requires-python = ">=3.10"
dependencies = ["PyYAML>=6,<7", "rapidfuzz>=3,<4"]

[project.optional-dependencies]
quality = ["ruamel.yaml>=0.17,<1", "rich>=13", "pypdfium2>=4,<6", "Pillow>=10", "apted==1.0.3", "fastapi>=0.110,<1", "uvicorn>=0.27,<1", "opencv-python-headless>=4.10,<5"]
jev = ["httpx>=0.27,<1", "Pillow==12.3.0", "playwright==1.62.0", "Markdown==3.10.3"]

[project.scripts]
glyphstack = "rsi_ocr.pageproof:main"
pageproof = "rsi_ocr.pageproof:main"
rsi-ocr = "rsi_ocr.cli:main"

[tool.setuptools.packages.find]
include = ["rsi_ocr*"]
exclude = ["rsi_ocr._vendor*"]

[tool.setuptools.package-data]
rsi_ocr = [
    "review_ui/*.html", "review_ui/*.css", "review_ui/*.js",
    "_vendor/jev/README.md", "_vendor/jev/**/LICENSE", "_vendor/jev/**/OFL.txt",
    "_vendor/jev/**/*.py", "_vendor/jev/**/*.yaml", "_vendor/jev/**/*.sh",
    "_vendor/jev/**/*.js", "_vendor/jev/**/*.css", "_vendor/jev/**/*.woff2",
]

[tool.setuptools.data-files]
"share/pageproof" = ["configs/default.yaml"]
