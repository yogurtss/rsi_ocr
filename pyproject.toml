[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rsi-ocr"
version = "0.1.0"
description = "Region-level hard-example mining for PaddleOCR-VL"
requires-python = ">=3.10"
dependencies = ["PyYAML>=6,<7", "rapidfuzz>=3,<4"]

[project.scripts]
rsi-ocr = "rsi_ocr.cli:main"

[tool.setuptools.packages.find]
include = ["rsi_ocr*"]
